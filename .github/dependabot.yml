version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
