name: CI

# The aggregate check is `ci-ok`. The `changes` job selects lanes
# from the changed paths (.github/scripts/ci_changes.py); pushes to main and
# manual runs select every lane. See docs/development/ci.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compatibility:
        description: Run the full interpreter and operating-system matrix
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      cpp: ${{ steps.select.outputs.cpp }}
      docs: ${{ steps.select.outputs.docs }}
      wheels: ${{ steps.select.outputs.wheels }}
      python_matrix: ${{ steps.select.outputs.python_matrix }}
      cpp_matrix: ${{ steps.select.outputs.cpp_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          COMPATIBILITY: ${{ github.event_name == 'schedule' || inputs.compatibility == true }}
        run: |
          args=("$BASE_REF")
          if [ "$COMPATIBILITY" = true ]; then args+=(--compatibility); fi
          python3 .github/scripts/ci_changes.py "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Install clice
        run: .github/scripts/install_clice.sh "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Hooks (whitespace, ruff, clice format)
        env:
          RUFF_OUTPUT_FORMAT: github
        run: uvx prek@0.5.11 run --all-files --show-diff-on-failure
      - name: Action pins
        run: python3 .github/scripts/check_action_pins.py
      - name: CI script tests
        run: uv run --no-project --with pytest pytest -p no:cacheprovider .github/scripts

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: MSVC developer shell
        if: runner.os == 'Windows'
        uses: bus1/cabuild/action/msdevshell@e22aba57d6e74891d059d66501b6b5aed8123c4d  # v1
        with:
          architecture: x64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          # Keep source-built PyPy dependencies across unrelated submodule
          # and documentation changes. setup-uv also keys by OS and Python.
          cache-dependency-glob: pyproject.toml
      # Statistics are printed by the action's post step.
      - name: Compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      - name: Route compilers through sccache
        shell: bash
        run: |
          {
            echo SCCACHE_GHA_ENABLED=true
            echo CMAKE_C_COMPILER_LAUNCHER=sccache
            echo CMAKE_CXX_COMPILER_LAUNCHER=sccache
          } >> "$GITHUB_ENV"
      - name: Install
        run: uv pip install ".[test]" --config-settings-package symusic:cmake.define.SYMUSIC_FAST_BUILD=ON
      - name: Test
        run: python -m pytest -n auto tests ${{ matrix.coverage && '--cov=symusic --cov-report=xml' || '' }}
      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python

  cpp:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    name: cpp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.cpp_matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: MSVC developer shell
        if: runner.os == 'Windows'
        uses: bus1/cabuild/action/msdevshell@e22aba57d6e74891d059d66501b6b5aed8123c4d  # v1
        with:
          architecture: x64
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: matrix.coverage
      # Statistics are printed by the action's post step.
      - name: Compiler cache
        if: runner.os != 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      - name: Route compilers through sccache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          {
            echo SCCACHE_GHA_ENABLED=true
            echo CMAKE_C_COMPILER_LAUNCHER=sccache
            echo CMAKE_CXX_COMPILER_LAUNCHER=sccache
          } >> "$GITHUB_ENV"
      - name: Configure
        run: >-
          cmake -S . -B "$RUNNER_TEMP/symusic-build" -DCMAKE_BUILD_TYPE=Debug -DSYMUSIC_BUILD_TESTS=ON -DSYMUSIC_ENABLE_LTO=OFF
          -DSYMUSIC_BUILD_EXAMPLES=${{ matrix.examples && 'ON' || 'OFF' }}
          ${{ runner.os == 'Windows' && '-G Ninja' || '' }}
          ${{ matrix.coverage && '-DSYMUSIC_ENABLE_COVERAGE=ON' || '' }}
      - name: Build
        run: cmake --build "$RUNNER_TEMP/symusic-build" --config Debug --parallel
      - name: Test
        run: ctest --test-dir "$RUNNER_TEMP/symusic-build" -C Debug --output-on-failure
      - name: Coverage report
        if: matrix.coverage
        run: >-
          uvx gcovr --xml "$RUNNER_TEMP/symusic-build/coverage.xml" --root . --filter src/ --filter include/
          --gcov-ignore-errors=no_working_dir_found "$RUNNER_TEMP/symusic-build"
      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/symusic-build/coverage.xml
          flags: cpp

  sanitize:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      # Failures abort with stacks. Leak detection stays on for the C++ tests.
      ASAN_OPTIONS: abort_on_error=0:halt_on_error=1:detect_leaks=1:print_stacktrace=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Statistics are printed by the action's post step.
      - name: Compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      - name: Configure
        run: >-
          cmake -S . -B "$RUNNER_TEMP/symusic-build" -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DSYMUSIC_BUILD_TESTS=ON -DSYMUSIC_SANITIZE="address;undefined"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build "$RUNNER_TEMP/symusic-build"
      - name: Test
        run: ctest --test-dir "$RUNNER_TEMP/symusic-build" --output-on-failure

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv pip install -r docs/requirements.txt
      - name: Build (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Check links
        if: github.event_name == 'schedule' || inputs.compatibility == true
        run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck

  wheels:
    needs: changes
    if: needs.changes.outputs.wheels == 'true'
    uses: ./.github/workflows/wheels.yml
    with:
      smoke: true

  ci-ok:
    needs: [changes, lint, python, cpp, sanitize, docs, wheels]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All selected lanes passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
