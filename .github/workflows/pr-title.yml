name: PR title

# Squash merges use the pull request title as the commit title, so it must
# follow the convention in CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check_pr_title.py
