name: Wheels

# Builds wheels with cibuildwheel (configuration in pyproject.toml) and the sdist,
# and tests every CPython wheel. With `smoke`, CI builds a single Linux wheel instead.
# release.yml calls the full build and publishes the artifacts.

on:
  workflow_dispatch:
    inputs:
      cross_wheels:
        description: Cross-build abi3 wheels on Linux and test on native runners
        type: boolean
        default: false
      cross_validation:
        description: Run the temporary cross-build experiment on native runners
        type: boolean
        default: false
  workflow_call:
    inputs:
      smoke:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ inputs.smoke }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The container is discarded after the build, so ccache writes to a host
      # directory mounted into it. The key names the OS, architecture and libc
      # of the container image; main saves it, every run restores it.
      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-smoke-linux-x86_64-manylinux_2_28-${{ github.run_id }}
          restore-keys: ccache-smoke-linux-x86_64-manylinux_2_28-
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
        env:
          # One stable-ABI build, tested on its oldest and newest CPython.
          CIBW_BUILD: cp312-manylinux_x86_64 cp315-manylinux_x86_64
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ runner.temp }}/ccache:/ccache"
          CIBW_ENVIRONMENT_LINUX: CCACHE_DIR=/ccache CCACHE_MAXSIZE=400M
          CIBW_BEFORE_ALL_LINUX: bash {project}/.github/scripts/install_ccache.sh /usr/local
          CIBW_CONFIG_SETTINGS: cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache
          CIBW_BEFORE_TEST_LINUX: ccache --show-stats
      # Files written by the container belong to root; actions/cache runs as the runner user.
      - name: Make compiler cache readable
        run: sudo chown -R "$USER" "$RUNNER_TEMP/ccache"
      - name: Save compiler cache
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  wheels:
    if: ${{ !inputs.smoke && !inputs.cross_validation && !inputs.cross_wheels }}
    name: wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: manylinux-x86_64, skip: "*-musllinux_*" }
          - { os: ubuntu-latest, platform: musllinux-x86_64, skip: "*-manylinux_*" }
          - { os: ubuntu-24.04-arm, platform: manylinux-aarch64, skip: "*-musllinux_*" }
          - { os: ubuntu-24.04-arm, platform: musllinux-aarch64, skip: "*-manylinux_*" }
          - { os: macos-15-intel, platform: macos-x86_64 }
          - { os: macos-15, platform: macos-arm64 }
          - { os: windows-latest, platform: windows-x64, msvc: x64 }
          - { os: windows-2022, platform: windows-x86, msvc: x86, archs: x86 }
          - { os: windows-11-arm, platform: windows-arm64, msvc: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: MSVC developer shell
        if: matrix.msvc
        uses: bus1/cabuild/action/msdevshell@e22aba57d6e74891d059d66501b6b5aed8123c4d  # v1
        with:
          architecture: ${{ matrix.msvc }}
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.archs || 'native' }}
          # Splits Linux by libc into parallel jobs; empty elsewhere.
          CIBW_SKIP: ${{ matrix.skip }}
          # Keep one cache per container/runner across the Python builds.
          # ccache checks source, headers and compiler flags; Python-dependent
          # objects miss automatically when the interpreter changes.
          CIBW_BEFORE_ALL_LINUX: bash {project}/.github/scripts/install_ccache.sh /usr/local
          CIBW_BEFORE_ALL_MACOS: brew install ccache
          CIBW_CONFIG_SETTINGS: ${{ runner.os != 'Windows' && 'cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}
          CIBW_BEFORE_TEST_LINUX: ccache --show-stats
          CIBW_BEFORE_TEST_MACOS: ccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    if: ${{ !inputs.smoke && !inputs.cross_validation && !inputs.cross_wheels }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build --sdist
      - name: Check native source headers
        run: |
          tar -tzf dist/*.tar.gz > sdist-files.txt
          grep -E '/3rdparty/libsndfile/include/sndfile[.]h$' sdist-files.txt
          grep -E '/3rdparty/vorbis/symbian/config[.]h$' sdist-files.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  cross-validation:
    if: ${{ inputs.cross_validation }}
    uses: ./.github/workflows/cross-validation.yml

  cross-wheels:
    if: ${{ inputs.cross_wheels }}
    uses: ./.github/workflows/cross-wheels.yml
