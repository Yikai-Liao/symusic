#:schema https://www.schemastore.org/prek.json
# Git hooks and the CI lint job: `prek run --all-files`.
# Install once with `uv tool install prek && prek install`.

# Vendored code and binary test fixtures are not ours to rewrite.
exclude = '^(3rdparty/|tests/testcases/|include/argparse\.h$)'

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.5"
hooks = [
    { id = "ruff-check", args = ["--fix"] },
    { id = "ruff-format" },
]

# C and C++ formatting with the clang-format built into clice, styled by
# .clang-format. Requires `clice` on PATH (https://github.com/clice-io/clice).
[[repos]]
repo = "local"
hooks = [
    { id = "clice-format", name = "clice format", entry = "clice format", language = "system", files = '\.(c|cc|cpp|h|hpp)$', exclude = '^cmake/' },
]
