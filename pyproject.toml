[build-system]
requires = [
    "setuptools>=42",
    "scikit-build>=0.13",
    "scikit-build-core>=0.3.3",
]
build-backend = "scikit_build_core.build"

[project]
name = "symusic"
requires-python = ">=3.9"
authors = [
    {name = "Yikai Liao", email = "lyk-boya@outlook.com"},
    {name = "Zhongqi Luo", email = "luozhongqi@mail.com"},
    {name = "Nathan Fradet"}
]
maintainers = [
    {name = "Yikai Liao", email = "lyk-boya@outlook.com"},
    {name = "Zhongqi Luo", email = "luozhongqi@mail.com"},
    {name = "Nathan Fradet"}
]
description = "A high performance MIDI file parser with comprehensible interface."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
keywords = ["midi",
    "music",
    "mir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: File Formats",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
]

dependencies = [
    "numpy",
    "pySmartDL",
    "platformdirs"
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Yikai-Liao/symusic"
Repository = "https://github.com/Yikai-Liao/symusic.git"
Issues = "https://github.com/Yikai-Liao/symusic/issues"

[tool.scikit-build]
cmake.version = ">=3.26.1"
ninja.version = ">=1.11"

[[tool.scikit-build.overrides]]
if.platform-system = "^win32$"
build.tool-args = ["/m"]

[[tool.scikit-build.overrides]]
if.platform-system = "^win32$"
if.env.VSCMD_VER = ".+"
if.env.CMAKE_GENERATOR = false
cmake.args = ["-GNinja"]
build.tool-args = []

[[tool.scikit-build.overrides]]
if.env.CMAKE_GENERATOR = "^Ninja( Multi-Config)?$"
build.tool-args = []

[tool.scikit-build.cmake.define]
BUILD_SYMUSIC_PY = "ON"
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

[tool.scikit-build.metadata]
version.provider = "scikit_build_core.metadata.regex"
version.input = "python/symusic/__init__.py"

[project.optional-dependencies]
test = ["pytest-cov", "pytest-xdist[psutil]", "mypy", "pretty_midi"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
log_cli_level = "INFO"
filterwarnings = [
  "error",
]
testpaths = ["tests"]

[tool.cibuildwheel]
# Used by .github/workflows/wheels.yml; the workflow selects the architecture.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* pp311-*"
# PyPy wheels only for manylinux x86_64 and macOS.
skip = "pp*-win* pp*-musllinux* pp*-manylinux_aarch64"
enable = ["pypy"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
test-extras = ["test"]
test-command = "cd {project} && pytest tests -n auto -p no:cacheprovider"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.cibuildwheel.windows]
environment = { CMAKE_GENERATOR = "Ninja" }
# The extension links no external DLLs; skip delvewheel.
repair-wheel-command = ""

[tool.ruff]
target-version = "py39"
extend-exclude = ["3rdparty", "build"]

[tool.ruff.lint]
# An explicit list, so the rule set does not change with Ruff's defaults.
# Rules that catch bugs or keep one idiom; layout belongs to `ruff format`.
select = [
    "E4", "E7", "E9", "F", "A", "B", "C4", "EM", "FA", "I", "ICN", "ISC", "NPY", "PERF", "PIE", "PT",
    "PTH", "RET", "RSE", "RUF", "SIM", "TC", "TID", "UP", "W",
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["A001"]  # Sphinx reads the `copyright` global
