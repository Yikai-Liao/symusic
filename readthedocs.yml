version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    nodejs: "20"
  jobs:
    pre_build:
      - pip install -r docs/requirements.txt
    post_build:
      - SITE_DIR="${READTHEDOCS_OUTPUT:-docs/_build}/html" && npx pagefind --site "$SITE_DIR" --output-subdir _pagefind
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
